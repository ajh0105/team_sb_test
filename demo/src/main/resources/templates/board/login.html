<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - BUSAN LOGIN</title>
    <link rel="stylesheet" th:href="@{/css/common/font.css}">
    <link rel="stylesheet" th:href="@{/css/common/chapter.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <link rel="stylesheet" th:href="@{/css/common/login.css}">
</head>
<body class="ch01">
<header th:replace="~{layout/header :: header}"></header>

<main class="page-wrap">
    <div class="container">
        <div class="login-image">
            <img th:src="@{/images/login.jpg}" alt="로그인 이미지">
        </div>
        <form class="login-form" th:action="@{/login}" th:object="${loginDto}" method="post">
            <h2>로그인</h2>
            <div th:if="${errorMsg}" class="error-msg" style="color:red; margin-bottom:10px;" th:text="${errorMsg}"></div>
            <input type="email" th:field="*{email}" placeholder="이메일" required>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red; font-size:12px;"></span>
            <input type="password" th:field="*{password}" placeholder="비밀번호" required>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red; font-size:12px;"></span>
            <button type="submit">로그인</button>
            <p>계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
        </form>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
