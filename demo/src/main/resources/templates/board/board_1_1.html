<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 - 상세보기</title>
    <link rel="stylesheet" th:href="@{/css/common/font.css}">
    <link rel="stylesheet" th:href="@{/css/common/chapter.css}">
    <link rel="stylesheet" th:href="@{/css/common/header.css}">
    <link rel="stylesheet" th:href="@{/css/common/sub_commu_write.css}">
</head>
<body class="ch01">
<header th:replace="~{layout/header :: header}"></header>

<section class="sub_visual">
    <h2>커뮤니티</h2>
    <p>자유게시판</p>
</section>

<div class="content_wrap">
    <div class="main_container">
        <aside class="lnb">
            <h2 class="lnb_tit">커뮤니티</h2>
            <ul>
                <li class="on"><a th:href="@{/sub_commu_1}">자유게시판</a></li>
                <li><a th:href="@{/sub_commu_2}">Q&A</a></li>
                <li><a th:href="@{/sub_commu_3}">관광불편신고</a></li>
            </ul>
        </aside>

        <section class="post_content">
            <h3 class="post_title">자유게시판</h3>

            <div class="post_box">
                <div class="post_subject">
                    - 부산 여행 다녀온 후기입니다 -
                </div>

                <div class="post_info">
                    <span>작성자 <strong>아무개</strong></span>
                    <span>작성일 <strong>2026년 02월 07일 14시 15분</strong></span>
                </div>

                <div class="post_body">
                    광안리 드론쇼 정말 멋지네요! 가족들과 함께 즐거운 시간 보내고 왔습니다.<br>
                    부산 여행 가시는 분들께 강력 추천합니다.
                </div>
            </div>

            <div class="post_btns">
                <div class="btn_left">
                    <a th:href="@{/sub_commu_1}" class="btn">목록보기</a>
                    <a th:href="@{/sub_commu_reply}" class="btn">답글쓰기</a>
                </div>
                <div class="btn_right">
                    <a th:href="@{/sub_commu_edit}" class="btn">글수정</a>
                    <a th:href="@{/sub_commu_delete}" class="btn">글삭제</a>
                </div>
            </div>
        </section>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
