<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 부산의 역사</title>
    <link rel="stylesheet" th:href="@{/css/common/font.css}">
    <link rel="stylesheet" th:href="@{/css/common/chapter.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <link rel="stylesheet" th:href="@{/css/common/signup.css}">
</head>
<body class="ch01">

<header th:replace="~{layout/header :: header}"></header>

<main class="signup_wrapper">
    <div class="signup_container">
        <div class="signup_title">
            <h2>회원가입</h2>
            <p>부산의 역사를 함께 기록할 회원을 모집합니다.</p>
        </div>

        <form th:action="@{/signup}" th:object="${memberFormDto}" method="post">
            <!-- 서버 오류 메시지 -->
            <div th:if="${errorMsg}" class="error-msg" style="color:red; margin-bottom:10px;" th:text="${errorMsg}"></div>

            <div class="form_section">
                <label for="name">이름</label>
                <input type="text" id="name" th:field="*{name}" placeholder="이름을 입력하세요" required>
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red; font-size:12px;"></span>
            </div>

            <div class="form_section">
                <label for="email">이메일 계정</label>
                <div class="input_group">
                    <input type="email" id="email" th:field="*{email}"
                           placeholder="example@busan.com"
                           required>
                    <button type="button" class="form_btn" onclick="checkEmail()">중복확인</button>
                    <span id="emailCheckMsg" class="custom_alert"></span>
                </div>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red; font-size:12px;"></span>
            </div>

            <div class="form_section">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" placeholder="6자 이상 입력" minlength="6" required>
                <p class="guide_txt">※ 영문, 숫자 포함 6자 이상 입력해 주세요.</p>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red; font-size:12px;"></span>
            </div>

            <div class="form_section">
                <label for="pw_confirm">비밀번호 확인</label>
                <input type="password" id="pw_confirm" placeholder="동일하게 입력해 주세요" required>
            </div>

            <div class="form_section">
                <label for="phone">휴대폰 번호</label>
                <div class="input_group">
                    <input type="tel" id="phone" th:field="*{phone}"
                           pattern="010-[0-9]{4}-[0-9]{4}"
                           placeholder="010-0000-0000" required>
                </div>
                <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color:red; font-size:12px;"></span>
            </div>

            <div class="agree_box">
                <div class="agree_row total">
                    <input type="checkbox" id="all_agree">
                    <label for="all_agree">전체 동의하기</label>
                </div>
                <div class="agree_row">
                    <input type="checkbox" id="agree1" name="agree1" required>
                    <label for="agree1">[필수] 이용약관 동의</label>
                    <a href="#" class="detail_link">자세히 보기</a>
                </div>
                <div class="agree_row">
                    <input type="checkbox" id="agree2" name="agree2" required>
                    <label for="agree2">[필수] 개인정보 수집 이용 동의</label>
                    <a href="#" class="detail_link">자세히 보기</a>
                </div>
            </div>

            <button type="submit" class="submit_btn">가입 완료</button>
        </form>

        <script>
            function checkEmail() {
                const email = document.getElementById('email').value;
                if (!email) { alert('이메일을 입력하세요.'); return; }
                fetch('/check-email?email=' + encodeURIComponent(email))
                    .then(res => res.json())
                    .then(available => {
                        const msg = document.getElementById('emailCheckMsg');
                        if (available) {
                            msg.textContent = '사용 가능한 이메일입니다.';
                            msg.style.color = 'green';
                        } else {
                            msg.textContent = '이미 사용 중인 이메일입니다.';
                            msg.style.color = 'red';
                        }
                        msg.style.display = 'inline';
                    });
            }

            // 전체 동의 체크박스 연동
            document.getElementById('all_agree').addEventListener('change', function() {
                document.getElementById('agree1').checked = this.checked;
                document.getElementById('agree2').checked = this.checked;
            });

            // 개별 항목 해제 시 전체 동의도 해제
            function syncAllAgree() {
                const agree1 = document.getElementById('agree1').checked;
                const agree2 = document.getElementById('agree2').checked;
                document.getElementById('all_agree').checked = agree1 && agree2;
            }
            document.getElementById('agree1').addEventListener('change', syncAllAgree);
            document.getElementById('agree2').addEventListener('change', syncAllAgree);
        </script>

        <p class="login_link">이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
