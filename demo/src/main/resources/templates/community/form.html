<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 - 글쓰기</title>
    <link rel="stylesheet" th:href="@{/css/common/font.css}">
    <link rel="stylesheet" th:href="@{/css/common/chapter.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <link rel="stylesheet" th:href="@{/css/common/sub_commu_ch01.css}">
    <link rel="stylesheet" th:href="@{/css/common/sub_commu_write.css}">
    <style>
        .form_row { margin-bottom: 16px; }
        .form_row label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .form_input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .form_textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; resize: vertical; box-sizing: border-box; }
        .form_btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn_cancel { padding: 8px 20px; background: #888; color: white; border-radius: 4px; text-decoration: none; font-size: 14px; }
        .btn_write { padding: 8px 20px; background: #1a56a0; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body class="ch01">
<header th:replace="~{layout/header :: header}"></header>

<section class="sub_visual">
    <h2>커뮤니티</h2>
    <p th:text="${boardType == 'FREE'} ? '자유게시판' : (${boardType == 'QNA'} ? 'Q&amp;A' : '관광불편신고')">글쓰기</p>
</section>

<div class="content_wrap">
    <div class="main_container">
        <aside class="lnb">
            <h2 class="lnb_tit">커뮤니티</h2>
            <ul>
                <li th:class="${boardType == 'FREE'} ? 'on'"><a th:href="@{/community/free}">자유게시판</a></li>
                <li th:class="${boardType == 'QNA'} ? 'on'"><a th:href="@{/community/qna}">Q&amp;A</a></li>
                <li th:class="${boardType == 'REPORT'} ? 'on'"><a th:href="@{/community/report}">관광불편신고</a></li>
            </ul>
        </aside>
        <section class="board_content">
            <h3 class="board_title"
                th:text="${boardType == 'FREE'} ? '자유게시판 글쓰기' : (${boardType == 'QNA'} ? 'Q&amp;A 질문하기' : '관광불편 신고하기')">
                글쓰기
            </h3>

            <div th:if="${errorMsg}" style="color:red; margin-bottom:15px;" th:text="${errorMsg}"></div>

            <form th:action="@{/community/write}" th:object="${boardFormDto}" method="post" class="write_form">
                <input type="hidden" name="boardType" th:value="${boardType}">

                <div class="form_row">
                    <label for="title">제목</label>
                    <input type="text" id="title" th:field="*{title}" placeholder="제목을 입력하세요" class="form_input">
                    <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red; font-size:12px; display:block;"></span>
                </div>

                <div class="form_row">
                    <label for="content">내용</label>
                    <textarea id="content" th:field="*{content}" rows="12" placeholder="내용을 입력하세요" class="form_textarea"></textarea>
                    <span th:if="${#fields.hasErrors('content')}" th:errors="*{content}" style="color:red; font-size:12px; display:block;"></span>
                </div>

                <div class="form_row" th:if="${boardType == 'REPORT'}">
                    <label>
                        <input type="checkbox" th:field="*{secret}"> 비밀글로 작성
                    </label>
                </div>

                <div class="form_btns">
                    <a th:href="${boardType == 'QNA'} ? '/community/qna' : (${boardType == 'REPORT'} ? '/community/report' : '/community/free')"
                       class="btn_cancel">취소</a>
                    <button type="submit" class="btn_write">등록하기</button>
                </div>
            </form>
        </section>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
