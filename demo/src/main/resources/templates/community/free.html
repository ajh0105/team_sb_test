<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 - 자유게시판</title>
    <link rel="stylesheet" th:href="@{/css/common/font.css}">
    <link rel="stylesheet" th:href="@{/css/common/chapter.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <link rel="stylesheet" th:href="@{/css/common/sub_commu_ch01.css}">
</head>
<body class="ch01">
<header th:replace="~{layout/header :: header}"></header>

<section class="sub_visual">
    <h2>커뮤니티</h2>
    <p>자유게시판</p>
</section>

<div class="content_wrap">
    <div class="main_container">
        <aside class="lnb">
            <h2 class="lnb_tit">커뮤니티</h2>
            <ul>
                <li class="on"><a th:href="@{/community/free}">자유게시판</a></li>
                <li><a th:href="@{/community/qna}">Q&amp;A</a></li>
                <li><a th:href="@{/community/report}">관광불편신고</a></li>
            </ul>
        </aside>
        <section class="board_content">
            <h3 class="board_title">자유게시판</h3>
            <table class="board_table">
                <thead>
                <tr>
                    <th class="col-no">No.</th>
                    <th class="col-title">글 제목</th>
                    <th class="col-writer">작성자</th>
                    <th class="col-date">작성일</th>
                    <th class="col-view">조회수</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(boards)}">
                    <td colspan="5" style="text-align:center; padding:30px;">등록된 게시글이 없습니다.</td>
                </tr>
                <tr th:each="board, stat : ${boards}">
                    <td th:text="${stat.count}"></td>
                    <td class="txt-left">
                        <a th:href="@{/community/{id}(id=${board.id})}" th:text="${board.title}"></a>
                    </td>
                    <td th:text="${board.member.name}"></td>
                    <td th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd')}"></td>
                    <td th:text="${board.views}"></td>
                </tr>
                </tbody>
            </table>

            <div class="board_write">
                <a th:href="@{/community/write(type='FREE')}" class="btn_write"
                   th:if="${session.loginMember != null}">글쓰기</a>
                <a th:href="@{/login}" class="btn_write"
                   th:if="${session.loginMember == null}">로그인 후 글쓰기</a>
            </div>
        </section>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
