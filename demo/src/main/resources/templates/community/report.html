<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 - 관광불편신고</title>
    <link rel="stylesheet" th:href="@{/css/common/font.css}">
    <link rel="stylesheet" th:href="@{/css/common/chapter.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <link rel="stylesheet" th:href="@{/css/common/sub_commu_ch01.css}">
    <style>
        .step { padding: 3px 8px; border-radius: 3px; font-size: 12px; font-weight: bold; display: inline-block; }
        .step.receive { background: #fff3e0; color: #ef6c00; }
        .step.process { background: #e8f5e9; color: #2e7d32; }
        .step.finish { background: #e3f2fd; color: #1976d2; }
        .lock_text { font-size: 12px; color: #999; margin-right: 4px; }
    </style>
</head>
<body class="ch01">
<header th:replace="~{layout/header :: header}"></header>

<section class="sub_visual">
    <h2>커뮤니티</h2>
    <p>관광불편신고</p>
</section>

<div class="content_wrap">
    <div class="main_container">
        <aside class="lnb">
            <h2 class="lnb_tit">커뮤니티</h2>
            <ul>
                <li><a th:href="@{/community/free}">자유게시판</a></li>
                <li><a th:href="@{/community/qna}">Q&amp;A</a></li>
                <li class="on"><a th:href="@{/community/report}">관광불편신고</a></li>
            </ul>
        </aside>
        <section class="board_content">
            <h3 class="board_title">관광불편신고</h3>
            <p class="board_info">부산 관광 중 겪으신 불편사항을 남겨주시면 신속히 처리해 드리겠습니다.</p>
            <table class="board_table">
                <thead>
                <tr>
                    <th class="col-no">No.</th>
                    <th class="col-title">신고 제목</th>
                    <th class="col-step">처리상태</th>
                    <th class="col-writer">작성자</th>
                    <th class="col-date">등록일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(boards)}">
                    <td colspan="5" style="text-align:center; padding:30px;">등록된 신고가 없습니다.</td>
                </tr>
                <tr th:each="board, stat : ${boards}">
                    <td th:text="${stat.count}"></td>
                    <td class="txt-left">
                        <span class="lock_text" th:if="${board.secret}">🔒</span>
                        <a th:href="@{/community/{id}(id=${board.id})}" th:text="${board.title}"></a>
                    </td>
                    <td>
                        <span th:class="${board.reportStep == '접수'} ? 'step receive' : (${board.reportStep == '조사중'} ? 'step process' : 'step finish')"
                              th:text="${board.reportStep}"></span>
                    </td>
                    <td th:text="${board.secret} ? (${board.member.name.substring(0,1)} + '**') : ${board.member.name}"></td>
                    <td th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd')}"></td>
                </tr>
                </tbody>
            </table>

            <div class="board_write">
                <a th:href="@{/community/write(type='REPORT')}" class="btn_write"
                   th:if="${session.loginMember != null}">불편 신고하기</a>
                <a th:href="@{/login}" class="btn_write"
                   th:if="${session.loginMember == null}">로그인 후 신고하기</a>
            </div>
        </section>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
