<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 - 게시글 상세</title>
    <link rel="stylesheet" th:href="@{/css/common/font.css}">
    <link rel="stylesheet" th:href="@{/css/common/chapter.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <link rel="stylesheet" th:href="@{/css/common/sub_commu_ch01.css}">
    <link rel="stylesheet" th:href="@{/css/common/sub_commu_content_read.css}">
    <style>
        .detail_meta { display: flex; gap: 20px; color: #666; font-size: 14px; margin: 10px 0 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .detail_content { min-height: 200px; line-height: 1.8; white-space: pre-wrap; padding: 20px 0; border-bottom: 1px solid #eee; }
        .detail_btns { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn_list, .btn_delete { padding: 8px 20px; border-radius: 4px; text-decoration: none; font-size: 14px; cursor: pointer; }
        .btn_list { background: #555; color: white; }
        .btn_delete { background: #e53935; color: white; border: none; }
        .badge_type { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
        .badge_free { background: #e3f2fd; color: #1565c0; }
        .badge_qna { background: #f3e5f5; color: #7b1fa2; }
        .badge_report { background: #fbe9e7; color: #bf360c; }
        .status_label { padding: 3px 8px; border-radius: 3px; font-size: 12px; font-weight: bold; }
        .status_waiting { background: #fff3e0; color: #ef6c00; }
        .status_complete { background: #e8f5e9; color: #2e7d32; }
        .step_receive { background: #fff3e0; color: #ef6c00; }
        .step_process { background: #e8f5e9; color: #2e7d32; }
        .step_finish { background: #e3f2fd; color: #1976d2; }
    </style>
</head>
<body class="ch01">
<header th:replace="~{layout/header :: header}"></header>

<section class="sub_visual">
    <h2>커뮤니티</h2>
    <p th:text="${board.boardType.name() == 'FREE'} ? '자유게시판' : (${board.boardType.name() == 'QNA'} ? 'Q&amp;A' : '관광불편신고')">게시글</p>
</section>

<div class="content_wrap">
    <div class="main_container">
        <aside class="lnb">
            <h2 class="lnb_tit">커뮤니티</h2>
            <ul>
                <li th:class="${board.boardType.name() == 'FREE'} ? 'on'"><a th:href="@{/community/free}">자유게시판</a></li>
                <li th:class="${board.boardType.name() == 'QNA'} ? 'on'"><a th:href="@{/community/qna}">Q&amp;A</a></li>
                <li th:class="${board.boardType.name() == 'REPORT'} ? 'on'"><a th:href="@{/community/report}">관광불편신고</a></li>
            </ul>
        </aside>
        <section class="board_content">
            <!-- 게시글 유형 배지 -->
            <span th:class="${board.boardType.name() == 'FREE'} ? 'badge_type badge_free' : (${board.boardType.name() == 'QNA'} ? 'badge_type badge_qna' : 'badge_type badge_report')"
                  th:text="${board.boardType.name() == 'FREE'} ? '자유게시판' : (${board.boardType.name() == 'QNA'} ? 'Q&amp;A' : '관광불편신고')"></span>

            <!-- QNA 상태 표시 -->
            <span th:if="${board.boardType.name() == 'QNA'}"
                  th:class="${board.qnaStatus == '답변완료'} ? 'status_label status_complete' : 'status_label status_waiting'"
                  th:text="${board.qnaStatus}"></span>

            <!-- REPORT 처리상태 표시 -->
            <span th:if="${board.boardType.name() == 'REPORT'}"
                  th:class="${board.reportStep == '접수'} ? 'status_label step_receive' : (${board.reportStep == '조사중'} ? 'status_label step_process' : 'status_label step_finish')"
                  th:text="${board.reportStep}"></span>

            <h3 class="board_title" th:text="${board.title}">제목</h3>

            <div class="detail_meta">
                <span>작성자: <strong th:text="${board.secret} ? (${board.member.name.substring(0,1)} + '**') : ${board.member.name}"></strong></span>
                <span>작성일: <span th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}"></span></span>
                <span>조회수: <span th:text="${board.views}"></span></span>
            </div>

            <div class="detail_content" th:text="${board.content}"></div>

            <div class="detail_btns">
                <a th:href="${board.boardType.name() == 'QNA'} ? '/community/qna' : (${board.boardType.name() == 'REPORT'} ? '/community/report' : '/community/free')"
                   class="btn_list">목록으로</a>

                <form th:if="${session.loginMember != null and (session.loginMember.id == board.member.id or session.loginMember.role.name() == 'ADMIN')}"
                      th:action="@{/community/{id}/delete(id=${board.id})}" method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <button type="submit" class="btn_delete">삭제</button>
                </form>
            </div>
        </section>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
