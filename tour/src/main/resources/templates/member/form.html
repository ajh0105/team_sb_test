<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><a class="navbar-brand" th:href="@{/}">✈️ Tour Project</a></div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 mt-3">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">회원 가입</h2>
                    <form th:action="@{/member/new}" th:object="${memberFormDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label">아이디</label>
                            <div class="input-group">
                                <input type="text" class="form-control" th:field="*{username}" placeholder="아이디를 입력하세요">
                                <button class="btn btn-outline-secondary" type="button">중복확인</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">비밀번호</label>
                            <input type="password" class="form-control" th:field="*{password}" placeholder="비밀번호를 입력하세요">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">이름</label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="이름을 입력하세요">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">이메일</label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="이메일을 입력하세요">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">가입하기</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
