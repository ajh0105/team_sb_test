<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><a class="navbar-brand" th:href="@{/}">✈️ Tour Project</a></div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 mt-5">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">로그인</h2>

                    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

                    <form th:action="@{/member/login}" th:object="${loginDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label">아이디</label>
                            <input type="text" class="form-control" th:field="*{username}" placeholder="아이디 입력">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">비밀번호</label>
                            <input type="password" class="form-control" th:field="*{password}" placeholder="비밀번호 입력">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">로그인</button>
                        <div class="text-center">
                            <span class="text-muted">아직 계정이 없으신가요?</span>
                            <a th:href="@{/member/new}" class="text-decoration-none ms-1">회원가입</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
