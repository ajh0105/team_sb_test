<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>투어 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><a class="navbar-brand" th:href="@{/}">✈️ Tour Project</a></div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-5">
                    <h2 class="card-title fw-bolder mb-3" th:text="${tour.name}">투어 이름</h2>
                    <h6 class="text-muted mb-4">📍 주소: <span th:text="${tour.address}"></span></h6>
                    <hr>
                    <p class="card-text lh-lg mt-4" th:text="${tour.comment}">투어 상세 설명 내용...</p>
                    <div class="text-end mt-4">
                        <a th:href="@{/tour/list}" class="btn btn-secondary">목록으로</a>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0 bg-light">
                <div class="card-body p-4">
                    <h4 class="mb-3">✍️ 리뷰 작성하기</h4>
                    <form th:action="@{/review/write}" method="post">
                        <input type="hidden" name="tourId" th:value="${tour.id}">
                        <input type="hidden" name="memberId" value="1"> <div class="row align-items-center mb-3">
                        <div class="col-auto">
                            <label class="form-label fw-bold mb-0">별점 (1~5)</label>
                        </div>
                        <div class="col-auto">
                            <input type="number" class="form-control" name="starRate" min="1" max="5" value="5" style="width: 80px;">
                        </div>
                    </div>
                        <div class="mb-3">
                            <textarea class="form-control" name="comment" rows="3" placeholder="이 투어는 어떠셨나요? 솔직한 리뷰를 남겨주세요."></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark">리뷰 등록</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
