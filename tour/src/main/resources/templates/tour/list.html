<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>투어 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><a class="navbar-brand" th:href="@{/}">✈️ Tour Project</a></div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🗺️ 투어 목록</h2>
        <a th:href="@{/tour/new}" class="btn btn-primary">+ 새 투어 등록</a>
    </div>

    <div class="row">
        <div class="col-12" th:if="${#lists.isEmpty(list)}">
            <div class="alert alert-light text-center py-5 border">등록된 투어가 없습니다.</div>
        </div>

        <div class="col-md-4 mb-4" th:each="tour : ${list}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <span class="badge bg-secondary mb-2" th:text="${tour.category}">카테고리</span>
                    <h5 class="card-title fw-bold" th:text="${tour.name}">투어 이름</h5>

                    <a th:href="@{/tour/detail/{id}(id=${tour.id})}" class="btn btn-outline-primary btn-sm mt-2">자세히 보기</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
