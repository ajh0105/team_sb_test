<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>투어 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><a class="navbar-brand" th:href="@{/}">✈️ Tour Project</a></div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h2 class="card-title mb-4">새 투어 등록</h2>

                    <form th:action="@{/tour/new}" th:object="${tourFormDto}" method="post" enctype="multipart/form-data">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">투어 이름</label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="투어의 이름을 입력하세요">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">대표 이미지 (썸네일)</label>
                            <input type="file" class="form-control" th:field="*{file}">
                            <div class="form-text">투어 목록에 보여질 이미지를 반드시 첨부해 주세요.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">카테고리</label>
                            <select class="form-select" th:field="*{category}">
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">주소</label>
                            <input type="text" class="form-control" th:field="*{address}" placeholder="정확한 주소를 입력하세요">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">전화번호</label>
                            <input type="text" class="form-control" th:field="*{tel}" placeholder="연락처를 입력하세요">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">설명</label>
                            <textarea class="form-control" th:field="*{comment}" rows="5" placeholder="투어에 대한 상세한 설명을 적어주세요."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/tour/list}" class="btn btn-outline-secondary">취소</a>
                            <button type="submit" class="btn btn-primary">투어 저장</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
