server:
  port: 8084

spring:
  application:
    name: tour

  datasource:
    url: jdbc:postgresql://localhost:5432/cheongdo
    username: postgres
    password: 1004

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  thymeleaf:
    cache: false

  Servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

file:
  upload-dir: C:/upload/
